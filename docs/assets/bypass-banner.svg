<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 360" width="1280" height="360">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#06090F"/>
      <stop offset="100%" stop-color="#0C1524"/>
    </linearGradient>
    <pattern id="dotGrid" width="32" height="32" patternUnits="userSpaceOnUse">
      <circle cx="16" cy="16" r="0.9" fill="#1A2840" opacity="0.8"/>
    </pattern>
    <radialGradient id="glowLeft" cx="210" cy="180" r="270" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#FF3333" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#FF3333" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowCenter" cx="590" cy="175" r="400" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0.04"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowRight" cx="1072" cy="180" r="280" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00FF88" stop-opacity="0.05"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
    </radialGradient>
    <filter id="fGlow" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fGlowRed" x="-60%" y="-60%" width="220%" height="220%">
      <feGaussianBlur stdDeviation="3.5" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <filter id="fTitle" x="-5%" y="-30%" width="110%" height="160%">
      <feGaussianBlur stdDeviation="14" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <linearGradient id="accentGrad" x1="365" y1="0" x2="920" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="1"/>
      <stop offset="65%" stop-color="#00D4FF" stop-opacity="0.35"/>
      <stop offset="100%" stop-color="#00D4FF" stop-opacity="0"/>
    </linearGradient>
    <linearGradient id="borderGrad" x1="0" y1="0" x2="1280" y2="0" gradientUnits="userSpaceOnUse">
      <stop offset="0%" stop-color="#00D4FF" stop-opacity="0"/>
      <stop offset="18%" stop-color="#00D4FF" stop-opacity="0.9"/>
      <stop offset="50%" stop-color="#0099EE" stop-opacity="0.6"/>
      <stop offset="82%" stop-color="#00FF88" stop-opacity="0.9"/>
      <stop offset="100%" stop-color="#00FF88" stop-opacity="0"/>
    </linearGradient>
    <clipPath id="clip">
      <rect width="1280" height="360" rx="14"/>
    </clipPath>
  </defs>

  <!-- BACKGROUND -->
  <rect width="1280" height="360" fill="url(#bg)" clip-path="url(#clip)"/>
  <rect width="1280" height="360" fill="url(#dotGrid)" clip-path="url(#clip)" opacity="0.55"/>
  <rect width="1280" height="360" fill="url(#glowLeft)" clip-path="url(#clip)"/>
  <rect width="1280" height="360" fill="url(#glowCenter)" clip-path="url(#clip)"/>
  <rect width="1280" height="360" fill="url(#glowRight)" clip-path="url(#clip)"/>

  <!-- Border and accent lines -->
  <rect width="1280" height="360" rx="14" fill="none" stroke="#1A2840" stroke-width="1.5"/>
  <rect x="0" y="0" width="1280" height="2.5" fill="url(#borderGrad)" clip-path="url(#clip)"/>
  <rect x="0" y="357.5" width="1280" height="2.5" fill="url(#borderGrad)" clip-path="url(#clip)"/>

  <!-- ===== LOCK ICON (left) ===== -->
  <!-- Outer pulse rings -->
  <ellipse cx="205" cy="183" rx="98" ry="90" fill="none" stroke="#FF3333" stroke-width="1" opacity="0.10"/>
  <ellipse cx="205" cy="183" rx="78" ry="72" fill="none" stroke="#FF3333" stroke-width="1" opacity="0.13"/>

  <!-- Shackle (U-shape) -->
  <path d="M 177,162 L 177,135 Q 177,107 205,107 Q 233,107 233,135 L 233,162"
        fill="none" stroke="#FF4444" stroke-width="3" stroke-linecap="round"
        filter="url(#fGlowRed)" opacity="0.92"/>

  <!-- Lock body -->
  <rect x="168" y="162" width="74" height="62" rx="9"
        fill="#130808" stroke="#FF4444" stroke-width="2.5" opacity="0.95"/>

  <!-- Keyhole -->
  <circle cx="205" cy="181" r="8.5" fill="#FF3333" opacity="0.65" filter="url(#fGlowRed)"/>
  <rect x="202" y="181" width="6" height="14" rx="2" fill="#FF3333" opacity="0.65"/>

  <!-- 403 label inside lock -->
  <text x="205" y="220" text-anchor="middle"
