        fill="#FF5555" opacity="0.80">403</text>

  <!-- Bypass arc over the lock -->
  <path d="M 143,185 C 100,52 312,52 267,185"
        fill="none" stroke="#00FF88" stroke-width="2.5" stroke-linecap="round"
        filter="url(#fGlow)" opacity="0.90"/>

  <!-- Arrowhead at arc end, pointing down -->
  <polygon points="261,177 273,177 267,192" fill="#00FF88" opacity="0.90" filter="url(#fGlow)"/>

  <!-- Arc endpoint labels -->
  <text x="133" y="180" text-anchor="end"
