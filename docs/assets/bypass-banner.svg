    <tspan fill="#56D364">200</tspan>
    <tspan fill="#585F6C">  score: </tspan>
    <tspan fill="#56D364">95</tspan>
    <tspan fill="#585F6C">  verified </tspan>
    <tspan fill="#56D364">✓</tspan>
  </text>

  <!-- Finding 2 -->
  <text x="912" y="201" font-family="'Courier New', Courier, monospace" font-size="11">
    <tspan fill="#56D364">+ </tspan>
    <tspan fill="#3FB950">X-Forwarded-For: 127.0.0.1</tspan>
  </text>
  <text x="912" y="214" font-family="'Courier New', Courier, monospace" font-size="10.5">
    <tspan fill="#585F6C">  status: </tspan>
    <tspan fill="#56D364">200</tspan>
    <tspan fill="#585F6C">  score: </tspan>
    <tspan fill="#56D364">88</tspan>
    <tspan fill="#585F6C">  verified </tspan>
    <tspan fill="#56D364">✓</tspan>
  </text>

  <!-- Finding 3 -->
  <text x="912" y="229" font-family="'Courier New', Courier, monospace" font-size="11">
