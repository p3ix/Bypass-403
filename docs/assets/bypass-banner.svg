<svg width="1280" height="360" viewBox="0 0 1280 360" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bypass — 403/401 bypass toolkit</title>
  <desc id="desc">Professional banner for Bypass, an authorized security testing CLI for access-control bypass research.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="360" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F14"/>
      <stop offset="0.45" stop-color="#0E141C"/>
      <stop offset="1" stop-color="#0A1218"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop stop-color="#3EE8B0"/>
      <stop offset="1" stop-color="#2BB8D9"/>
    </linearGradient>
    <linearGradient id="panel" x1="72" y1="88" x2="520" y2="272" gradientUnits="userSpaceOnUse">
      <stop stop-color="#111820" stop-opacity="0.95"/>
      <stop offset="1" stop-color="#0C1218" stop-opacity="0.88"/>
    </linearGradient>
    <linearGradient id="glow" cx="0" cy="0" r="1" gradientUnits="userSpaceOnUse" gradientTransform="translate(980 80) rotate(35) scale(420 280)">
      <stop stop-color="#2EE8B0" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#2EE8B0" stop-opacity="0"/>
    </linearGradient>
    <filter id="soft" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="24" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
    <clipPath id="panelClip">
      <rect x="72" y="88" width="448" height="184" rx="14"/>
    </clipPath>
  </defs>

  <!-- Background -->
  <rect width="1280" height="360" fill="url(#bg)"/>
  <rect width="1280" height="360" fill="url(#glow)"/>

  <!-- Subtle grid -->
  <g opacity="0.22" stroke="#2A3A48" stroke-width="1">
    <path d="M0 60H1280M0 120H1280M0 180H1280M0 240H1280M0 300H1280"/>
    <path d="M80 0V360M160 0V360M240 0V360M320 0V360M400 0V360M480 0V360M560 0V360M640 0V360M720 0V360M800 0V360M880 0V360M960 0V360M1040 0V360M1120 0V360M1200 0V360"/>
  </g>

  <!-- Top accent line -->
  <rect x="0" y="0" width="1280" height="3" fill="url(#accent)"/>

  <!-- Terminal panel -->
  <rect x="72" y="88" width="448" height="184" rx="14" fill="url(#panel)" stroke="#2A3F4F" stroke-width="1"/>
  <rect x="72" y="88" width="448" height="36" rx="14" fill="#0A1016"/>
  <rect x="72" y="110" width="448" height="14" fill="#0A1016"/>
  <circle cx="98" cy="106" r="5.5" fill="#FF5F57"/>
  <circle cx="118" cy="106" r="5.5" fill="#FEBC2E"/>
  <circle cx="138" cy="106" r="5.5" fill="#28C840"/>
  <text x="160" y="110" fill="#5E7383" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="12" letter-spacing="0.04em">bypass — probe</text>

  <g clip-path="url(#panelClip)" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace">
    <text x="96" y="152" fill="#5EEAD4" font-size="17" font-weight="600">$</text>
    <text x="116" y="152" fill="#E8F1F5" font-size="17"> bypass https://target.tld/admin -k</text>
    <text x="96" y="186" fill="#94A8B5" font-size="15">baseline</text>
    <text x="176" y="186" fill="#64748B" font-size="15">403</text>
    <text x="218" y="186" fill="#64748B" font-size="15">→</text>
    <text x="242" y="186" fill="#34D399" font-size="15" font-weight="700">200</text>
    <text x="286" y="186" fill="#64748B" font-size="15">· verified 3/3 · curl ready</text>
    <text x="96" y="218" fill="#64748B" font-size="14">host/sni · headers · path · smuggling-lite</text>
    <rect x="96" y="236" width="220" height="3" rx="1.5" fill="url(#accent)" opacity="0.85"/>
  </g>

  <!-- Logo mark -->
  <g transform="translate(600 108)">
    <rect x="0" y="0" width="56" height="56" rx="14" fill="#111820" stroke="#2A3F4F"/>
    <path d="M28 14L40 22V34L28 42L16 34V22L28 14Z" stroke="url(#accent)" stroke-width="2.2" fill="none"/>
    <path d="M22 28H34" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round"/>
    <path d="M28 22V34" stroke="#5EEAD4" stroke-width="2" stroke-linecap="round"/>
  </g>

  <!-- Title block -->
  <text x="672" y="152" fill="#F8FAFC" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="58" font-weight="700" letter-spacing="-0.03em">Bypass</text>
  <text x="674" y="192" fill="#94A8B5" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="22" font-weight="500">403/401 bypass toolkit</text>
  <text x="674" y="224" fill="#64748B" font-family="Inter, ui-sans-serif, system-ui, -apple-system, Segoe UI, Helvetica, Arial, sans-serif" font-size="17" font-weight="400">Async scans · raw sockets · verified findings · JSON/CSV/curl</text>

  <!-- Feature pills -->
  <g font-family="Inter, ui-sans-serif, system-ui, sans-serif" font-size="13" font-weight="600">
    <rect x="674" y="248" width="118" height="32" rx="16" fill="#111820" stroke="#2A3F4F"/>
    <text x="694" y="269" fill="#5EEAD4">Bug Bounty</text>
    <rect x="802" y="248" width="108" height="32" rx="16" fill="#111820" stroke="#2A3F4F"/>
    <text x="822" y="269" fill="#C3D5DC">Authorized use</text>
    <rect x="920" y="248" width="72" height="32" rx="16" fill="#111820" stroke="#2A3F4F"/>
    <text x="940" y="269" fill="#C3D5DC">Python 3.10+</text>
  </g>

  <!-- Author -->
  <text x="674" y="312" fill="#5EEAD4" font-family="ui-monospace, SFMono-Regular, Menlo, Consolas, monospace" font-size="14" font-weight="600">@p3i</text>

  <!-- Right-side status flow -->
  <g transform="translate(1040 118)" opacity="0.92">
    <rect width="168" height="120" rx="12" fill="#111820" stroke="#2A3F4F"/>
    <text x="20" y="34" fill="#64748B" font-family="Inter, ui-sans-serif, sans-serif" font-size="12" font-weight="600" letter-spacing="0.06em">STATUS FLOW</text>
    <circle cx="28" cy="58" r="5" fill="#F59E0B"/>
    <text x="44" y="63" fill="#E8F1F5" font-family="ui-monospace, monospace" font-size="14">403 Forbidden</text>
    <path d="M28 74 L28 82" stroke="#334155" stroke-width="1.5"/>
    <circle cx="28" cy="92" r="5" fill="#34D399"/>
    <text x="44" y="97" fill="#34D399" font-family="ui-monospace, monospace" font-size="14" font-weight="700">200 OK</text>
  </g>

  <!-- Bottom border -->
  <rect x="0" y="357" width="1280" height="3" fill="#1E2936"/>
</svg>
