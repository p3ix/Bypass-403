    <rect width="1280" height="380" fill="url(#bg)"/>
    <rect x="0" y="0" width="1280" height="4" fill="url(#accent)"/>

    <!-- Grid -->
    <g opacity="0.18" stroke="#2A3A48" stroke-width="1">
      <path d="M0 76H1280M0 152H1280M0 228H1280M0 304H1280"/>
      <path d="M64 0V380M128 0V380M192 0V380M256 0V380M320 0V380M384 0V380M448 0V380M512 0V380M576 0V380M640 0V380M704 0V380M768 0V380M832 0V380M896 0V380M960 0V380M1024 0V380M1088 0V380M1152 0V380M1216 0V380"/>
    </g>

    <!-- ═══ Column 1: Terminal (x 48–468) ═══ -->
    <rect x="48" y="72" width="420" height="236" rx="20" fill="url(#panelFill)" stroke="#2A3F4F" stroke-width="1"/>
    <!-- Title bar -->
    <path d="M48 92C48 81.9543 56.9543 73 67 73H449C459.046 73 468 81.9543 468 92V108H48V92Z" fill="#0A1016"/>
    <line x1="48" y1="108" x2="468" y2="108" stroke="#2A3F4F" stroke-width="1"/>
    <circle cx="74" cy="90" r="5" fill="#FF5F57"/>
    <circle cx="94" cy="90" r="5" fill="#FEBC2E"/>
    <circle cx="114" cy="90" r="5" fill="#28C840"/>
    <text x="132" y="94" fill="#5E7383" font-family="ui-monospace, Menlo, Consolas, monospace" font-size="11">bypass probe</text>

    <g clip-path="url(#termBody)" font-family="ui-monospace, Menlo, Consolas, monospace">
      <text x="72" y="142" fill="#5EEAD4" font-size="15" font-weight="600">$</text>
      <text x="88" y="142" fill="#E8F1F5" font-size="15"> bypass target.tld/admin -k</text>
      <text x="72" y="172" fill="#94A8B5" font-size="14">baseline</text>
      <text x="142" y="172" fill="#64748B" font-size="14"> 403</text>
      <text x="178" y="172" fill="#64748B" font-size="14"> → </text>
      <text x="198" y="172" fill="#34D399" font-size="14" font-weight="700">200</text>
      <text x="232" y="172" fill="#64748B" font-size="14"> · verified</text>
      <text x="72" y="200" fill="#64748B" font-size="13">path · headers · host · smuggling</text>
      <rect x="72" y="218" width="180" height="3" rx="1.5" fill="url(#accent)"/>
    </g>

    <!-- ═══ Column 2: Brand (x 500–968) ═══ -->
    <!-- Logo -->
    <rect x="500" y="88" width="52" height="52" rx="14" fill="#121A24" stroke="#2A3F4F" stroke-width="1"/>
    <path d="M526 102L538 110V122L526 130L514 122V110L526 102Z" stroke="url(#accent)" stroke-width="2" fill="none"/>
    <path d="M520 116H532M526 110V122" stroke="#5EEAD4" stroke-width="1.8" stroke-linecap="round"/>

    <text x="568" y="128" fill="#F8FAFC" font-family="Inter, system-ui, -apple-system, Segoe UI, sans-serif" font-size="48" font-weight="700" letter-spacing="-0.02em">Bypass</text>

    <text x="500" y="168" fill="#94A8B5" font-family="Inter, system-ui, sans-serif" font-size="20" font-weight="500">403/401 bypass toolkit</text>

    <text x="500" y="198" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="15">Async · raw sockets · verified · JSON/CSV/curl</text>

    <!-- Pills row -->
    <rect x="500" y="224" width="100" height="30" rx="15" fill="#121A24" stroke="#2A3F4F" stroke-width="1"/>
    <text x="518" y="244" fill="#5EEAD4" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Bug Bounty</text>

    <rect x="612" y="224" width="118" height="30" rx="15" fill="#121A24" stroke="#2A3F4F" stroke-width="1"/>
    <text x="630" y="244" fill="#C3D5DC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Authorized use</text>

    <rect x="742" y="224" width="88" height="30" rx="15" fill="#121A24" stroke="#2A3F4F" stroke-width="1"/>
    <text x="760" y="244" fill="#C3D5DC" font-family="Inter, system-ui, sans-serif" font-size="12" font-weight="600">Python 3.10+</text>

    <text x="500" y="286" fill="#5EEAD4" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="600">@p3i</text>

    <!-- ═══ Column 3: Status (x 1000–1232) ═══ -->
    <rect x="1000" y="72" width="232" height="236" rx="20" fill="#121A24" stroke="#2A3F4F" stroke-width="1"/>

    <text x="1024" y="108" fill="#64748B" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600" letter-spacing="0.08em">STATUS</text>

    <rect x="1024" y="124" width="184" height="44" rx="12" fill="#0A1016" stroke="#2A3F4F" stroke-width="1"/>
    <circle cx="1044" cy="146" r="5" fill="#F59E0B"/>
    <text x="1060" y="151" fill="#E8F1F5" font-family="ui-monospace, Menlo, monospace" font-size="13">403 Forbidden</text>

    <path d="M1044 178V198" stroke="#334155" stroke-width="2" stroke-linecap="round"/>

    <rect x="1024" y="206" width="184" height="44" rx="12" fill="#0A1016" stroke="#1E3A32" stroke-width="1"/>
    <circle cx="1044" cy="228" r="5" fill="#34D399"/>
    <text x="1060" y="233" fill="#34D399" font-family="ui-monospace, Menlo, monospace" font-size="13" font-weight="700">200 OK</text>

    <rect x="1024" y="268" width="184" height="28" rx="14" fill="#0F1F1A" stroke="#1E3A32" stroke-width="1"/>
    <text x="1044" y="287" fill="#5EEAD4" font-family="Inter, system-ui, sans-serif" font-size="11" font-weight="600">curl reproducible</text>
