    <linearGradient id="panelFill" x1="48" y1="72" x2="468" y2="308" gradientUnits="userSpaceOnUse">
      <stop stop-color="#121A24"/>
      <stop offset="1" stop-color="#0C1218"/>
    </linearGradient>
    <clipPath id="roundOuter">
      <rect width="1280" height="380" rx="28" ry="28"/>
    </clipPath>
    <clipPath id="termBody">
      <rect x="48" y="108" width="420" height="200" rx="0"/>
    </clipPath>
  </defs>

  <g clip-path="url(#roundOuter)">
