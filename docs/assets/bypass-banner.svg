<svg width="1280" height="380" viewBox="0 0 1280 380" fill="none" xmlns="http://www.w3.org/2000/svg" role="img" aria-labelledby="title desc">
  <title id="title">Bypass — 403/401 bypass toolkit</title>
  <desc id="desc">Professional banner for Bypass, an authorized security testing CLI.</desc>

  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1280" y2="380" gradientUnits="userSpaceOnUse">
      <stop stop-color="#0B0F14"/>
      <stop offset="0.5" stop-color="#0E141C"/>
      <stop offset="1" stop-color="#0A1218"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
